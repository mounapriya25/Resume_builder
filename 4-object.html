<!DOCTYPE html>
<html>
    <head>
        <title> objects</title>
    </head>
    <body>
        <h3>object</h3>
        <p> An object group multiple values together</p>
        <p>null is intentionally want something to be empty</p>

        <script>
            console.log(localStorage.getItem("member"));
            //console.log(product.rating.count) here we cannot access before intialisation
            //but we can access member before intialisation due localstorage is saved it permanatly
            //if u refresh the page also it saved it

            const product = {
                name:'dress',
                price:100,
                ['size']:'m',
                rating:{
                    count:1
                },
                fun :function name(){
                    console.log("it is a function")
                }
            };
            console.log(product.name,product.price,product['price'],product['size'])//another way
            product.price=100000;// change the value
            console.log(product.rating.count)
            product.fun();//function

            product.color='blue';//new property
            console.log(product,product.price)

            delete product.name;//delete
            console.log(product)

            //convert the js object into json object
            console.log(JSON.stringify(product));//it doestnot have more feauters like js and it don't contain functions
            //json object to js object
            jsontojs=JSON.stringify(product);
            console.log(JSON.parse(jsontojs));

        console.log("hi".toUpperCase());
        console.log(3.0.toString());
        console.log(typeof (true.toString()),typeof true);
        localStorage.setItem("member","this sentense is saved permanently")
        console.log(localStorage.getItem("member"));

        let ob1={//reference
            mess:"It's changing"
        };
        let ob2=ob1;
        ob2.mess='hello'
        ob1.mess="hi";
        console.log(ob1,ob2)
        let ob3={
            mess:"It's changing"
        }
        console.log(ob1===ob3)// it is false because it compare references not values ,they both have not same reference in computer
        console.log(ob2.mess===ob3.mess)
        console.log(ob2===ob1)// same values different reference

        //shortcuts
        const ob4={//no much different for const and let
            mess:"It's changing"
        }
        const m=ob4;
        console.log(m)

        const {mess}=ob4;//another method
        console.log(mess)

        const obj5={
           
            method1:function fun1(){
                console.log("function in method")
            },
            // another method to call a function
            method2(){
                console.log("this is another method in function in method")
            }
        }
        
        obj5.method1()
        obj5.method2()
        console.log(obj5)
        </script>
    </body>
</html>

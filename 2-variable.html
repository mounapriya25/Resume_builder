<!DOCTYPE html>
<html>
    <head>
        <title>cart</title>
    </head>
    <body>
        <h3>Cart Quality</h3>
        <button onclick="
            console.log(`Cart quality :${cart}`)
        ">Show quantity</button>
        <button onclick=
        "cart=++cart,console.log(`Cart quality :${cart}`)"
        >Add to Cart</button>
        <button onclick="cart+=2 ,console.log(`Cart quality :${cart}`)">+2</button>
        <button onclick="cart+=3,
        console.log(`Cart quality :${cart}`)">+3</button>
        <button onclick="cart=0,console.log(`cart was reset\nCart quality :${cart}`)">Reset Cart</button>
        <button onclick=
        "cart-=1,console.log(`Cart quality :${cart}`)"
        >Remove from  Cart</button>

        <script>
            let cart=0;
        </script>

        <br>
        <!--calculation--> 
        <button onclick="exp+='1',console.log(exp)">1</button>
        <button onclick="exp+='2',console.log(exp)">2</button>
        <button onclick="exp+='3',console.log(exp)">3</button>
        <button onclick="exp+='+',console.log(exp)">+</button>
        <button onclick="console.log(eval(exp))">=</button>
        <button onclick="exp='',console.log(exp)">refresh</button>

        <script>
            let exp=" ";
            
        </script>
    
    </body>
</html>

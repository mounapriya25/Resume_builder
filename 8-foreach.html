<!DOCTYPE html>
<html>
    <head>
      <!--instead of using for loop  we use for each-->
        <style>
          body{
            background-color: rgb(31, 28, 28);
            color: rgb(224, 216, 216);
          }
            input{
                margin: 5px;
            }
            .b{
                background-color: rgb(252, 64, 64);
                padding: 5px;
            }
         
            .p{
                
                border: 2px solid ;
                padding: 10px;
                width: 400px;

            }
            .but{
                background-color: rgb(246, 218, 6);
                
            }
            .m{
              border: solid 2px;
              margin-bottom: 200px;
            }
            .todo,.toin{
              display: grid;
              grid-template-columns: 200px 150px 100px ;
              column-gap: 20px;
              row-gap: 20px;/*this for futher adding rows*/
            }
            .toin{
              margin-bottom: 20px;/*this is for add and delte*/
            }
        </style>
    </head>
    <body>
        <h1>array</h1>
        <p> array is a list of values, and it a type of object </p>
        <h2>Project</h2>
        <label>To do list</label><br>
        <div class="toin">
       
        <input type="text" placeholder="Enter list" class="js-txt">
        <input type="date" class="js-date">
        <button  class="b"  onclick="add()">Add</button>
      </div>
        <div class="js-add todo"></div>
      
        <script>
            let txt=document.querySelector('.js-txt');
            let d=document.querySelector('.js-date');
            let b1=[{name:'washdishes',date:'2024-08-31'}];
 
            let ishtml='';
            let i;
            let a = document.querySelector('.js-add');
            todo()
            function todo(){

              b1.forEach(function(object,index){
                let{name,date}=object;

                let html=`<div>${name}</div>
                        <div>${date}</div>
                        <button class=""onclick="del()">delete</button>`
                        console.log(name,date)
                ishtml+=html
              })
              a.innerHTML=ishtml; 
              ishtml='';
              
            }
            function add(){
              b1.push({name:txt.value,
                date:d.value
              }
              );


            todo();
          };
          console.log(b1);
          
            function del(){
            
                b1.splice(`${i-1}`,1) ;
                todo()
                console.log(i,'is index');
            }
           
        </script>
    </body>
</html>
